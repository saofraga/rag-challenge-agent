<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BimBam Buy — Atendimento</title>
<style>
  :root {
    --cor-fundo: #f4f5f7;
    --cor-texto: #1c1e21;
    --cor-usuario: #2563eb;
    --cor-usuario-2: #7c3aed;
    --cor-usuario-texto: #ffffff;
    --cor-assistente: #ffffff;
    --cor-assistente-texto: #1c1e21;
    --cor-borda: #d8dae0;
    --sombra-bolha: 0 1px 2px rgba(28, 30, 33, 0.06), 0 2px 8px rgba(28, 30, 33, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #f4f5f7 0%, #eef1fd 55%, #f4f5f7 100%);
    color: var(--cor-texto);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--cor-borda);
    background: #fff;
  }

  .avatar {
    position: relative;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: linear-gradient(135deg, var(--cor-usuario), var(--cor-usuario-2));
  }

  .avatar .status-online {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #22c55e;
    border: 2px solid #fff;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #6b7280;
  }

  #historico {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .mensagem {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
    box-shadow: var(--sombra-bolha);
    animation: mensagemEntrada 220ms ease-out;
  }

  @keyframes mensagemEntrada {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .mensagem.usuario {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--cor-usuario), var(--cor-usuario-2));
    color: var(--cor-usuario-texto);
    border-bottom-right-radius: 4px;
  }

  .mensagem.assistente {
    align-self: flex-start;
    background: var(--cor-assistente);
    color: var(--cor-assistente-texto);
    border: 1px solid var(--cor-borda);
    border-bottom-left-radius: 4px;
  }

  .mensagem.assistente.carregando {
    animation: mensagemEntrada 220ms ease-out, pulsoDigitando 1.3s ease-in-out infinite;
  }

  @keyframes pulsoDigitando {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .mensagem.erro {
    align-self: flex-start;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--cor-borda);
    background: #fff;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--cor-borda);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
    transition: border-color 150ms ease;
  }

  input[type="text"]:focus {
    border-color: var(--cor-usuario);
  }

  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--cor-usuario), var(--cor-usuario-2));
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }

  button:hover:not(:disabled) {
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    transform: translateY(-1px);
  }

  button:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
  }

  button svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  button:focus-visible {
    outline: 2px solid var(--cor-usuario);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .mensagem,
    .mensagem.assistente.carregando,
    button {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar" aria-hidden="true">
        🛍️
        <span class="status-online"></span>
      </div>
      <div>
        <h1>BimBam Buy — Atendimento</h1>
        <p>Pergunte sobre pagamento, envio, reembolso, garantia ou o programa de afiliados.</p>
      </div>
    </header>
    <div id="historico" role="log" aria-live="polite"></div>
    <form id="formulario">
      <input type="text" id="entrada" placeholder="Digite sua pergunta..." aria-label="Digite sua pergunta" autocomplete="off" required />
      <button type="submit" id="botao">
        Enviar
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
  </div>

  <script>
    const historico = document.getElementById("historico");
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("entrada");
    const botao = document.getElementById("botao");

    function adicionarMensagem(texto, classe) {
      const div = document.createElement("div");
      div.className = "mensagem " + classe;
      div.textContent = texto;
      historico.appendChild(div);
      historico.scrollTop = historico.scrollHeight;
      return div;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const pergunta = entrada.value.trim();
      if (!pergunta) return;

      adicionarMensagem(pergunta, "usuario");
      entrada.value = "";
      entrada.disabled = true;
      botao.disabled = true;
      const mensagemEspera = adicionarMensagem("Digitando...", "assistente");
      mensagemEspera.classList.add("carregando");

      try {
        const resposta = await fetch("/perguntar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pergunta }),
        });

        if (!resposta.ok) {
          throw new Error("A API respondeu com erro (status " + resposta.status + ").");
        }

        const dados = await resposta.json();
        mensagemEspera.classList.remove("carregando");
        mensagemEspera.textContent = dados.resposta;
      } catch (erro) {
        mensagemEspera.remove();
        adicionarMensagem("Não foi possível obter uma resposta agora. Tente novamente em instantes.", "erro");
      } finally {
        entrada.disabled = false;
        botao.disabled = false;
        entrada.focus();
      }
    });
  </script>
</body>
</html>
