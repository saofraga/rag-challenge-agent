<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BimBam Buy — Atendimento</title>
<style>
  :root {
    --cor-fundo: #f4f5f7;
    --cor-texto: #1c1e21;
    --cor-usuario: #2563eb;
    --cor-usuario-texto: #ffffff;
    --cor-assistente: #ffffff;
    --cor-assistente-texto: #1c1e21;
    --cor-borda: #d8dae0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--cor-borda);
    background: #fff;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #6b7280;
  }

  #historico {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .mensagem {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .mensagem.usuario {
    align-self: flex-end;
    background: var(--cor-usuario);
    color: var(--cor-usuario-texto);
    border-bottom-right-radius: 4px;
  }

  .mensagem.assistente {
    align-self: flex-start;
    background: var(--cor-assistente);
    color: var(--cor-assistente-texto);
    border: 1px solid var(--cor-borda);
    border-bottom-left-radius: 4px;
  }

  .mensagem.erro {
    align-self: flex-start;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--cor-borda);
    background: #fff;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--cor-borda);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--cor-usuario);
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: var(--cor-usuario);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>BimBam Buy — Atendimento</h1>
      <p>Pergunte sobre pagamento, envio, reembolso, garantia ou o programa de afiliados.</p>
    </header>
    <div id="historico"></div>
    <form id="formulario">
      <input type="text" id="entrada" placeholder="Digite sua pergunta..." autocomplete="off" required />
      <button type="submit" id="botao">Enviar</button>
    </form>
  </div>

  <script>
    const historico = document.getElementById("historico");
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("entrada");
    const botao = document.getElementById("botao");

    function adicionarMensagem(texto, classe) {
      const div = document.createElement("div");
      div.className = "mensagem " + classe;
      div.textContent = texto;
      historico.appendChild(div);
      historico.scrollTop = historico.scrollHeight;
      return div;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const pergunta = entrada.value.trim();
      if (!pergunta) return;

      adicionarMensagem(pergunta, "usuario");
      entrada.value = "";
      entrada.disabled = true;
      botao.disabled = true;
      const mensagemEspera = adicionarMensagem("Digitando...", "assistente");

      try {
        const resposta = await fetch("/perguntar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pergunta }),
        });

        if (!resposta.ok) {
          throw new Error("A API respondeu com erro (status " + resposta.status + ").");
        }

        const dados = await resposta.json();
        mensagemEspera.textContent = dados.resposta;
      } catch (erro) {
        mensagemEspera.remove();
        adicionarMensagem("Não foi possível obter uma resposta agora. Tente novamente em instantes.", "erro");
      } finally {
        entrada.disabled = false;
        botao.disabled = false;
        entrada.focus();
      }
    });
  </script>
</body>
</html>
